version: "3"

services:
    web:
        build: .
        volumes:
            - .:/var/manudux
            - manudux_data:/var/manudux/data
            - manudux_media:/var/manudux/media
        ports:
            - "8866:8866"
        env_file:
            - .env
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8866/healthz/')"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        networks:
            - backend

volumes:
    manudux_data:
    manudux_media:

networks:
    backend:
