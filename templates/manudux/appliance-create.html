{% extends "manudux/base.html" %}
{% load i18n %}
{% load static %}

{% block content %}
<div class="container">
    <section>
        <form action="{% url 'manudux:create-appliance' %}{% if location %}?location_id={{ location.id }}{% endif %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_div }}
            <button>{% trans "Create" %}</button>
        </form>
    </section>
</div>
{% endblock %}
