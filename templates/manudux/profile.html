{% extends "manudux/base.html" %}
{% load i18n %}
{% load static %}

{% block title %}{% trans "My Account" %}{% endblock %}

{% block content %}
<div class="container">
    <h1 class="title">{% trans "My Account" %}</h1>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_div }}
            <button type="submit" class="btn btn-primary">{% trans "Save" %}</button>
        </form>
    </div>

    <a href="{% url 'accounts:password_change' %}" class="btn">{% trans "Change password" %}</a>
</div>
{% endblock %}
