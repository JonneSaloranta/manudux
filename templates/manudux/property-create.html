{% extends "manudux/base.html" %}
{% load i18n %}
{% load static %}

{% block content %}
<div class="container">
    <section>
        <div class="form-card">
            <form action="{% url 'manudux:create-property' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}

                {{ form.as_div }}
                <button class="btn btn-primary">{% trans "Create" %}</button>
            </form>
        </div>
        {% if success %}
        <p style="color: green; font-weight: bold;">{% trans "Property create successfully" %}</p>
        {% endif %}
        {% if error %}
        <p style="color: red; font-weight: bold;">{% trans "Could not create property" %}</p>
        {% endif %}
    </section>
</div>

{% endblock %}
