{% load i18n %}
{% load static %}

<div class="card">

    <div class="card-content">

        <div class="card-image">
            <div class="img-skeleton img-skeleton--square">
                {% if not property.image %}
                <img src="{% static 'manudux/img/placeholder300x200.png'%}" alt="{% trans 'Placeholder image' %}">
                {% else %}
                <img src="{{ property.image.url }}" alt="{% blocktrans with name=property.name %}{{ name }}{% endblocktrans %}">
                {% endif %}
            </div>
        </div>

        <div class="card-title">
            <h2>{{ property.name }}</h2>
        </div>

        {% if property.description %}
        <div class="card-body">{{ property.description|escape|truncatewords_html:5 }}</div>
        {% else %}
        <div class="card-body">{% trans "No description available" %}</div>
        {% endif %}

        <div class="card-actions">
            <a href="{% url 'manudux:edit-property' pk=property.id %}" class="btn btn-primary">{% trans "Edit" %}</a>
            <a href="{% url 'manudux:delete-property' pk=property.id %}" class="btn btn-danger">{% trans "Delete" %}</a>
        </div>

        <a href="{% url 'manudux:property' pk=property.id %}" class="card-link" aria-label="{% blocktrans with name=property.name %}View {{ name }}{% endblocktrans %}"></a>
    </div>
</div>
