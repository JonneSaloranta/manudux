{% extends "manudux/base.html" %}
{% load i18n %}
{% load static %}

{% block content %}
<div class="container">
    <section>
        <div class="form-card">
            <form action="{% url 'manudux:edit-user' pk=user_obj.id %}" method="post">
                {% csrf_token %}

                {{ form.as_div }}
                <button class="btn btn-primary">{% trans "Save" %}</button>
            </form>
        </div>
    </section>
</div>
{% endblock %}
